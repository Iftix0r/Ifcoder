<div class="flex flex-wrap gap-1.5" id="tools" aria-label="Tezkor buyruqlar">
  {% for tool in chapter.tools %}<button type="button" class="tool-chip" data-tool="{{ tool }}">{{ tool }}</button>{% endfor %}
</div>
<section class="card overflow-hidden">
  <div class="code-editor" id="editor">
    <div class="code-gutter" id="gutter" aria-hidden="true"></div>
    <div class="code-area">
      <pre class="code-layer" id="highlight" aria-hidden="true"></pre>
      <textarea id="code" class="code-input" aria-label="Python kodi" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" placeholder="# Kodni shu yerga yozing"></textarea>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 border-t border-line bg-surface-2/50 px-3 py-2.5">
    <button type="button" id="run" class="btn btn-primary">{% icon "play" "size-4" %}<span id="run-label">Ishga tushirish</span></button>
    <button type="button" id="reset" class="btn btn-secondary btn-icon" aria-label="Boshiga qaytarish" title="Boshiga qaytarish">{% icon "rotate-ccw" "size-4" %}</button>
    {% if speed %}
      <div class="segmented ml-auto" role="group" aria-label="Tezlik">
        <button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
      </div>
    {% endif %}
  </div>
</section>
<div id="status" class="game-status" aria-live="polite" hidden></div>
<div id="console" class="game-console" hidden><p class="mb-1 flex items-center gap-1.5 text-xs font-semibold text-ink-3">{% icon "terminal" "size-3.5" %}print</p><div id="console-lines"></div></div>
