<details class="card p-4" {% if not best_stars %}open{% endif %}>
  <summary class="cursor-pointer text-sm font-semibold">{% icon "book-open" "mr-1 inline size-4 text-brand-500" %}Dars</summary>
  <p class="mt-2 text-sm leading-relaxed text-ink-2">{{ level.lesson }}</p>
  {% if level.example %}<pre class="code-sample">{{ level.example }}</pre>{% endif %}
  {% if concept %}<a href="{% url 'portal_lesson' concept.slug %}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center gap-1.5 text-sm font-medium text-brand-300 hover:underline">{% icon "graduation-cap" "size-4" %}Darslikda «{{ concept.title }}» mavzusi</a>{% endif %}
</details>
