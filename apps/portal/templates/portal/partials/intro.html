{% if show_intro %}
<div id="intro" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="intro-label">
  <div class="card w-full max-w-lg p-6 animate-fade-up">
    <p id="intro-label" class="text-xs font-semibold tracking-wider text-brand-300 uppercase">Yangi mavzu: {{ concept.title }}</p>
    {% for slide in concept.slides %}
      <div data-slide {% if not forloop.first %}hidden{% endif %}>
        <h2 class="mt-2 text-xl font-bold">{{ slide.title }}</h2>
        <p class="mt-2 text-sm leading-relaxed text-ink-2">{{ slide.text }}</p>
        {% if slide.code %}<pre class="code-sample">{{ slide.code }}</pre>{% endif %}
      </div>
    {% endfor %}
    <div class="mt-5 flex items-center justify-between gap-3">
      <div class="flex gap-1.5" id="intro-dots" aria-hidden="true">{% for slide in concept.slides %}<span class="intro-dot"></span>{% endfor %}</div>
      <div class="flex gap-2"><button type="button" class="btn btn-ghost" id="intro-skip">O'tkazish</button><button type="button" class="btn btn-primary" id="intro-next">Keyingisi</button></div>
    </div>
  </div>
</div>
{% endif %}
