# IFCODER-SECURITY: ilova papkasi saytning ochiq ildizi. Diskdagi fayllar (baza, backup, log, .git, media)
# to'g'ridan-to'g'ri ochilmaydi: sayt faqat Django orqali ishlaydi. Bu blokni olib tashlamang.
Options -Indexes
RewriteEngine On
RewriteRule (^|/)\.git(/|$) - [F,L]
RewriteCond %{REQUEST_URI} !^/static/
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{REQUEST_FILENAME} -f
RewriteRule ^ - [F,L]
# END IFCODER-SECURITY

