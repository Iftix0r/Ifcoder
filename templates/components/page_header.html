<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between animate-fade-up">
  <div class="min-w-0">
    {% if eyebrow %}<p class="mb-1 text-xs font-semibold tracking-wider text-brand-600 uppercase dark:text-brand-300">{{ eyebrow }}</p>{% endif %}
    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-[28px]">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-sm text-ink-2">{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions %}<div class="flex shrink-0 items-center gap-2">{{ actions }}</div>{% endif %}
</div>
