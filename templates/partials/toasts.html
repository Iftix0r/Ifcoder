{% if messages %}
<script type="application/json" id="django-messages">[{% for m in messages %}{"message": "{{ m|escapejs }}", "level": "{{ m.tags|default:'info'|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
{% endif %}
<div x-data aria-live="polite" class="pointer-events-none fixed inset-x-0 bottom-20 z-[90] flex flex-col items-center gap-2 px-4 sm:inset-x-auto sm:right-5 sm:bottom-5 sm:items-end">
  <template x-for="t in $store.toasts.items" :key="t.id">
    <div x-show="t.visible"
         x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="opacity-0 translate-y-3 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 translate-y-2"
         class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-2xl border border-line bg-surface/95 p-3.5 pr-3 shadow-lift backdrop-blur-xl">
      <span class="mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full"
            :class="{'bg-emerald-500/15 text-emerald-500': t.level === 'success', 'bg-rose-500/15 text-rose-500': t.level === 'error', 'bg-amber-500/15 text-amber-500': t.level === 'warning', 'bg-brand-500/15 text-brand-500': t.level === 'info'}">
        <template x-if="t.level === 'success'">{% icon "check" "size-3.5" "3" %}</template>
        <template x-if="t.level === 'error'">{% icon "x" "size-3.5" "3" %}</template>
        <template x-if="t.level === 'warning'">{% icon "triangle-alert" "size-3.5" "2.5" %}</template>
        <template x-if="t.level === 'info'">{% icon "info" "size-3.5" "2.5" %}</template>
      </span>
      <p class="flex-1 pt-0.5 text-sm font-medium text-ink" x-text="t.message"></p>
      <button type="button" @click="$store.toasts.remove(t.id)" class="rounded-lg p-1 text-ink-3 transition hover:bg-surface-2 hover:text-ink" aria-label="Yopish">{% icon "x" "size-4" %}</button>
    </div>
  </template>
</div>
