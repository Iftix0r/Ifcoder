{{ palette_items|json_script:"palette-data" }}
<div x-data="palette" data-search-url="{% url 'search' %}" @keydown.window="onKey($event)" @palette:open.window="show()">
  <div x-cloak x-show="open" class="fixed inset-0 z-[80] flex items-start justify-center p-4 pt-[12vh]" role="dialog" aria-modal="true" aria-label="Buyruqlar paneli">
    <div x-show="open" x-transition.opacity class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm" @click="hide()"></div>
    <div x-show="open" x-trap.noscroll="open" @keydown.escape="hide()"
         x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95 -translate-y-2" x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition duration-150 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 scale-95"
         class="relative w-full max-w-xl overflow-hidden rounded-2xl border border-line bg-surface shadow-lift">
      <div class="flex items-center gap-3 border-b border-line px-4">
        <span class="text-ink-3">{% icon "search" "size-5" %}</span>
        <input x-ref="input" x-model="query" @input="active = 0" @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)" @keydown.enter.prevent="go()"
               type="text" placeholder="Vazifa, mijoz, loyiha, eslatma yoki bo'lim…" class="h-14 flex-1 bg-transparent text-[15px] text-ink placeholder:text-ink-3 focus:outline-none" autocomplete="off">
        <kbd class="kbd">Esc</kbd>
      </div>
      <ul x-ref="list" class="max-h-[50vh] overflow-y-auto p-2">
        <template x-for="(item, i) in results" :key="item.section + item.href">
          <li>
            <a :href="item.href" @click.prevent="go(item)" @mouseenter="active = i" :data-active="active === i"
               class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition-colors"
               :class="active === i ? 'bg-brand-500/10 text-ink' : 'text-ink-2'">
              <span class="flex size-8 items-center justify-center rounded-lg border border-line bg-surface-2" :class="active === i && 'text-brand-600 dark:text-brand-300'" x-html="item.icon"></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate font-medium" x-text="item.label"></span>
                <span x-show="item.sub" class="block truncate text-xs text-ink-3" x-text="item.sub"></span>
              </span>
              <span class="text-xs text-ink-3" x-text="item.section"></span>
            </a>
          </li>
        </template>
        <li x-show="!results.length && !loading" class="px-3 py-10 text-center text-sm text-ink-3">Hech narsa topilmadi</li>
        <li x-show="loading && !remote.length" class="space-y-2 p-1">
          <div class="skeleton h-11"></div><div class="skeleton h-11 opacity-60"></div>
        </li>
      </ul>
      <div class="flex items-center gap-4 border-t border-line bg-surface-2/50 px-4 py-2.5 text-[11px] text-ink-3">
        <span class="flex items-center gap-1"><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> tanlash</span>
        <span class="flex items-center gap-1"><kbd class="kbd">↵</kbd> ochish</span>
        <span class="ml-auto hidden sm:inline"><kbd class="kbd">N</kbd> yangi vazifa</span>
      </div>
    </div>
  </div>
</div>
