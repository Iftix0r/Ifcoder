<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xatolik yuz berdi — Ifcoder</title>
<style>
  :root { --bg:#0d1117; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --border:#30363d; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --text:#1f2328; --muted:#656d76; --accent:#0969da; --border:#d0d7de; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  .box { text-align: center; padding: 24px; }
  .code { font-size: 64px; font-weight: 700; margin: 0; }
  p { color: var(--muted); font-size: 15px; margin: 8px 0 20px; }
  a { color: #fff; background: var(--accent); text-decoration: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">500</p>
    <p>Serverda kutilmagan xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.</p>
    <a href="/panel/">Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
