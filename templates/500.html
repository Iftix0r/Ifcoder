<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 — Server Xatoligi | Ifcoder</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ef4444'/><stop offset='1' stop-color='%23f87171'/></linearGradient></defs><rect width='64' height='64' rx='18' fill='url(%23g)'/><text x='32' y='45' font-family='sans-serif' font-size='38' font-weight='900' fill='%23ffffff' text-anchor='middle'>I</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131b2e;
    --border: rgba(51, 65, 85, 0.6);
    --text: #f8fafc;
    --muted: #94a3b8;
    --red: #ef4444;
    --red-glow: rgba(239, 68, 68, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 24px;
  }
  .container {
    max-width: 520px;
    width: 100%;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 36px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: '';
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 240px; height: 160px;
    background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
    pointer-events: none;
  }
  .code {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 88px;
    font-weight: 900;
    line-height: 1;
    margin: 0 0 12px;
    background: linear-gradient(135deg, #f87171, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.04em;
  }
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 10px;
  }
  p {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #ffffff;
    box-shadow: 0 4px 14px var(--red-glow);
  }
  .btn-danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--red-glow);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="code">500</div>
    <h1>Internal Server Error</h1>
    <p>Serverda kutilmagan xatolik yuz berdi. Tizim muammoni bartaraf etmoqda. Birozdan so'ng qayta urinib ko'ring.</p>
    <div class="btn-group">
      <a href="/panel/" class="btn btn-danger">&larr; Bosh sahifaga qaytish</a>
      <a href="javascript:location.reload()" class="btn btn-secondary">Yangilash (F5)</a>
    </div>
  </div>
</body>
</html>
