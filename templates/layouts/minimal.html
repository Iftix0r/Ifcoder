{% extends "base.html" %}
{% load static %}
{% block body %}
<div class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden px-5 py-16 text-center">
  <div class="bg-grid pointer-events-none absolute inset-0 opacity-70 mask-radial"></div>
  <div class="bg-brand-gradient pointer-events-none absolute top-1/3 left-1/2 size-96 -translate-x-1/2 -translate-y-1/2 rounded-full opacity-15 blur-3xl"></div>
  <div class="relative max-w-md animate-fade-up">
    {% block content %}{% endblock %}
  </div>
  <a href="/" class="relative mt-12 flex items-center gap-2 text-sm text-ink-3 hover:text-ink">
    <img src="{% static 'img/logo.svg' %}" alt="" class="size-5"> Ifcoder
  </a>
</div>
{% endblock %}
