{% load dashboard_extras %}
{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}<a href="?{% querystring page=page_obj.previous_page_number %}">&larr;</a>{% endif %}
  {% for num in page_obj.paginator.page_range %}
    {% if num == page_obj.number %}<span class="current">{{ num }}</span>
    {% else %}<a href="?{% querystring page=num %}">{{ num }}</a>{% endif %}
  {% endfor %}
  {% if page_obj.has_next %}<a href="?{% querystring page=page_obj.next_page_number %}">&rarr;</a>{% endif %}
</div>
{% endif %}
