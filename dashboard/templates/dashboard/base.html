<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ifcoder{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #9aa3af;
    --accent: #5b8def;
    --green: #3fb950;
    --yellow: #d9a441;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
  }
  header a.brand {
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
  }
  header nav a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
  }
  header nav a:hover { color: var(--text); }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .card .label {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  h2 {
    font-size: 15px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 32px 0 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); padding: 14px; font-size: 14px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: rgba(91,141,239,0.15);
    color: var(--accent);
  }
  .badge.completed { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.paused { background: rgba(217,164,65,0.15); color: var(--yellow); }
  .badge.inactive { background: rgba(107,114,128,0.2); color: var(--gray); }
  form.login {
    max-width: 320px;
    margin: 80px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  form.login input {
    width: 100%;
    padding: 8px 10px;
    margin: 6px 0 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
  }
  form.login button {
    width: 100%;
    padding: 9px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  .errorlist { color: #e5534b; font-size: 13px; list-style: none; padding: 0; }
</style>
</head>
<body>
{% if user.is_authenticated %}
<header>
  <a class="brand" href="{% url 'dashboard:home' %}">Ifcoder</a>
  <nav>
    <a href="{% url 'dashboard:home' %}">Dashboard</a>
    <a href="/admin/">Admin</a>
    <a href="{% url 'logout' %}">Chiqish ({{ user.username }})</a>
  </nav>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
