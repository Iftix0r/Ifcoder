<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>{{ document.title }} — Print</title>
<style>
  @page {
    size: A4;
    margin: 20mm;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1e293b;
    background: #ffffff;
    margin: 0;
    padding: 40px;
    font-size: 14px;
    line-height: 1.7;
  }
  .print-wrap {
    max-width: 800px;
    margin: 0 auto;
  }
  .print-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 20px;
    margin-bottom: 30px;
  }
  .brand-title {
    font-size: 22px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .doc-number {
    font-size: 13px;
    color: #64748b;
    font-weight: 600;
  }
  .doc-body {
    margin-bottom: 40px;
  }
  .doc-body h2 { font-size: 20px; margin-top: 0; }
  .doc-body table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  .doc-body th, .doc-body td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
  .doc-body th { background: #f8fafc; font-weight: 700; }
  
  .signatures {
    display: flex;
    justify-content: space-between;
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
  }
  .sig-block {
    width: 45%;
  }
  .sig-line {
    border-bottom: 1px solid #94a3b8;
    margin-top: 50px;
  }
  .no-print {
    background: #1e293b;
    color: #ffffff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    border-radius: 8px;
  }
  @media print {
    .no-print { display: none; }
    body { padding: 0; }
  }
</style>
</head>
<body>
<div class="no-print">
  <span>🖨 Hujjatni chop etish yoki PDF sifatida saqlash</span>
  <button onclick="window.print()" style="background:#4f46e5;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;">
    🖨 Chop etish (Print / PDF)
  </button>
</div>

<div class="print-wrap">
  <div class="print-header">
    <div class="brand-title">⚡ Ifcoder Software Studio</div>
    <div class="doc-number">
      Hujjat №: #DOC-{{ document.pk }}<br>
      Sana: {{ document.created_at|date:"d.m.Y" }}
    </div>
  </div>

  <div class="doc-body">
    {{ document.content|safe }}
  </div>

  <div class="signatures">
    <div class="sig-block">
      <strong>Pudratachi:</strong><br>
      "Ifcoder Software Studio"<br>
      Imzo: <div class="sig-line"></div>
    </div>
    <div class="sig-block">
      <strong>Mijoz:</strong><br>
      {{ document.client.name }}<br>
      Imzo: <div class="sig-line"></div>
    </div>
  </div>
</div>
</body>
</html>
